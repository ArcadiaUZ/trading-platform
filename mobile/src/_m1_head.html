<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>XAUView Mobile</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{
  --bg:#000000; --panel:#0F0F0F; --panel2:#1F1F1F; --border:#2E2E2E; --border2:#4A4A4A;
  --text:#DBDBDB; --text2:#B8B8B8; --text3:#8C8C8C;
  --up:#22AB94; --down:#F7525F; --accent:#2962FF; --cross:#8C8C8C;
  --asiaF:rgba(99,102,241,.055); --asiaB:rgba(129,140,248,.5);
  --lonF:rgba(59,130,246,.045); --nyF:rgba(249,115,22,.045);
  --bsl:#FF4D6D; --ssl:#22D3CE; --fvg:rgba(250,204,21,.16); --fvgB:rgba(250,204,21,.5);
  --ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'SF Mono',Menlo,Consolas,monospace;
}
body.light{
  --bg:#FFFFFF; --panel:#F0F3FA; --panel2:#E8ECF4; --border:#E0E3EB; --border2:#D1D4DC;
  --text:#131722; --text2:#5D606B; --text3:#9598A1; --cross:#9598A1;
  --asiaF:rgba(99,102,241,.09); --lonF:rgba(59,130,246,.06); --nyF:rgba(249,115,22,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font:13px/1.3 var(--ui);
  -webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;outline:none}

#app{position:fixed;inset:0;display:grid;grid-template-rows:calc(46px + env(safe-area-inset-top)) 1fr calc(54px + env(safe-area-inset-bottom));overflow:hidden}

/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:6px;padding:env(safe-area-inset-top) 8px 0;
  height:calc(46px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--border);z-index:30}
.symchip{display:flex;align-items:baseline;gap:3px;height:34px;padding:0 8px;border-radius:8px;
  background:var(--panel2);font-weight:600;font-size:13.5px;letter-spacing:-.1px;white-space:nowrap}
.symchip .feed{color:var(--text3);font-weight:500;font-size:11px}
.symchip .car{color:var(--text3);font-size:10px;margin-left:1px}
.tfchip{height:34px;padding:0 10px;border-radius:8px;background:var(--panel2);font-weight:600;font-size:12.5px;color:var(--text)}
.tfchip:active,.symchip:active{background:var(--border)}
.ibtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--text2);position:relative}
.ibtn:active{background:var(--border)}
.ibtn svg{width:19px;height:19px}
.ibtn .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--down);display:none;box-shadow:0 0 0 2px var(--panel)}
.ibtn.has .dot{display:block}
.spacer{flex:1}

/* ---------- chart ---------- */
#chartwrap{position:relative;overflow:hidden;background:var(--bg);touch-action:none}
#chart{position:absolute;inset:0;display:block;touch-action:none}
#legend{position:absolute;left:8px;top:6px;pointer-events:none;font-size:11.5px;line-height:16px;
  text-shadow:0 1px 2px rgba(0,0,0,.7);max-width:74%}
#legend .l1{display:flex;align-items:baseline;gap:3px;font-size:12.5px;font-weight:600}
#legend .l1 .feed{color:var(--text3);font-size:10.5px;font-weight:500}
#legend .l1 .tf{color:var(--text3);font-weight:500}
#legend .l2{color:var(--text2);font-size:11px;font-variant-numeric:tabular-nums}
#legend .l2 b{color:var(--text);font-weight:500}
.badge{position:absolute;right:60px;top:7px;font-size:9.5px;font-weight:700;letter-spacing:.5px;
  padding:2px 5px;border-radius:4px;background:rgba(34,171,148,.16);color:var(--up);border:1px solid rgba(34,171,148,.35)}
.badge.off{background:rgba(140,140,140,.14);color:var(--text3);border-color:var(--border2)}
#crossTip{position:absolute;background:rgba(31,31,31,.97);border:1px solid var(--border2);border-radius:6px;
  padding:5px 7px;font-size:11px;line-height:15px;pointer-events:none;font-variant-numeric:tabular-nums;
  box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:12;white-space:nowrap;display:none}
#crossTip .u{color:var(--up)} #crossTip .d{color:var(--down)}
#toast{position:absolute;left:12px;right:12px;top:10px;background:rgba(31,31,31,.97);
  border:1px solid var(--border2);border-radius:10px;padding:9px 11px;font-size:12px;z-index:40;
  box-shadow:0 10px 30px rgba(0,0,0,.55);transform:translateY(-140%);transition:transform .22s ease;display:flex;gap:8px;align-items:flex-start}
#toast.on{transform:translateY(0)}
#toast .t{flex:1;line-height:16px}
#toast .t b{color:var(--text)}
#toast .t span{color:var(--text2);font-size:11px}
#toast .x{color:var(--text3);padding:0 2px}

/* ---------- bottom bar ---------- */
#bottom{display:flex;align-items:center;justify-content:space-around;padding:0 4px env(safe-area-inset-bottom);
  height:calc(54px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--border);z-index:30}
.tbtn{flex:1;height:44px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--text2)}
.tbtn:active{background:var(--border)}
.tbtn.on{color:#fff;background:var(--accent)}
.tbtn.on svg{stroke:#fff}
.tbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tbtn span{font-size:9px;letter-spacing:.1px}

/* ---------- sheets ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top-left-radius:14px;border-top-right-radius:14px;
  border-top:1px solid var(--border);z-index:60;transform:translateY(105%);transition:transform .24s cubic-bezier(.3,.9,.3,1);
  max-height:82vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:translateY(0)}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;flex:none}
.sh-head h3{font-size:14px;font-weight:600}
.sh-head .x{color:var(--text3);font-size:20px;line-height:1;padding:2px 6px}
.sh-body{overflow-y:auto;padding:0 12px 16px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--border);font-size:13px}
.row:last-child{border-bottom:0}
.row .lbl{flex:1;color:var(--text)}
.row .lbl small{display:block;color:var(--text3);font-size:10.5px;margin-top:1px}
.row .val{color:var(--text2);font-variant-numeric:tabular-nums}
.row.on{color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px 4px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 4px}
.opt{height:42px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;font-size:13px;color:var(--text)}
.opt.on{background:var(--accent);color:#fff;font-weight:600}
.opt:active{opacity:.8}
.ck{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--border);font-size:13px}
.ck .lbl{flex:1}
.ck .lbl small{display:block;color:var(--text3);font-size:10.5px;margin-top:1px;font-weight:400}
.sw{width:44px;height:26px;border-radius:13px;background:var(--border);position:relative;transition:background .18s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .18s}
.sw.on{background:var(--accent)}
.sw.on::after{left:21px}
.ctl{display:flex;align-items:center;gap:8px;padding:10px 4px;font-size:12px;color:var(--text2)}
.ctl input[type=number],.ctl input[type=text]{flex:1;background:var(--panel2);border:1px solid var(--border);
  color:var(--text);border-radius:8px;padding:9px 10px;font:inherit;font-size:14px;min-width:0}
.ctl input:focus{border-color:var(--accent);outline:none}
.btnrow{display:flex;gap:8px;padding:12px 4px 4px}
.btn{flex:1;height:46px;border-radius:10px;background:var(--panel2);color:var(--text);font-size:14px;font-weight:600;display:grid;place-items:center}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:rgba(247,82,95,.16);color:var(--down)}
.btn:active{opacity:.8}
.alertrow{display:flex;align-items:center;gap:9px;padding:11px 4px;border-bottom:1px solid var(--border)}
.alertrow .info{flex:1;min-width:0}
.alertrow .info b{font-size:13px}
.alertrow .info small{display:block;color:var(--text3);font-size:10.5px;margin-top:2px}
.alertrow .info b .ti{width:15px;height:15px;fill:currentColor;margin-right:5px;vertical-align:-2px;display:inline-block}
.alertrow .p{font-variant-numeric:tabular-nums;font-size:13px;color:var(--text)}
.alertrow .del{color:var(--text3);padding:4px 6px;font-size:16px}
.alertrow.trig{opacity:.5}
.empty{color:var(--text3);font-size:12px;text-align:center;padding:22px 10px;line-height:18px}
.hint{color:var(--text3);font-size:11px;line-height:16px;padding:8px 4px 0}
.seg{display:flex;background:var(--panel2);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:7px;font-size:12.5px;color:var(--text2)}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.chips{display:flex;gap:7px;flex-wrap:wrap;padding:4px 0 8px}
.chip{padding:9px 13px;border-radius:9px;background:var(--panel2);font-size:13px;color:var(--text)}
.chip.on{background:var(--accent);color:#fff}
.chip:active{opacity:.8}
.dott{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
</style>
<style>
.apkic{width:21px;height:21px;display:block;fill:currentColor;stroke:none}
.ibtn .ic{width:20px;height:20px;display:grid;place-items:center}
.ibtn .apkic{width:20px;height:20px;opacity:.94}
.tbtn .apkic{width:21px;height:21px}
.tbtn.on .apkic{fill:#fff}
.tbtn span{font-size:9px}
.chip .apkic{width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-right:5px}
.row .apkic{width:17px;height:17px;fill:var(--text2)}
.opt .oi{width:17px;height:17px;display:inline-block;vertical-align:-3px;margin-right:6px;fill:currentColor}
.btn .bi{width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-right:6px;fill:currentColor}
</style>

  var els = document.querySelectorAll('[data-ic]');
  for (var i = 0; i < els.length; i++) els[i].innerHTML = apkIcon(els[i].getAttribute('data-ic'));
}
