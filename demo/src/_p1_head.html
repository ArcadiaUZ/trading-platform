<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XAUView — OANDA:XAUUSD · FXCM:GBPUSD</title>
<style>
:root{
  --bg:#131722; --panel:#1e222d; --panel2:#232733; --border:#2a2e39; --border2:#363a45;
  --text:#d1d4dc; --text2:#787b86; --text3:#5d606b; --hover:#2a2e39;
  --up:#089981; --down:#f23645; --accent:#2962ff; --accent2:#1e63ff; --cross:#758696;
  --upF:rgba(8,153,129,.10); --downF:rgba(242,54,69,.10);
  --asiaF:rgba(99,102,241,.05); --asiaB:rgba(129,140,248,.55);
  --lonF:rgba(59,130,246,.05); --nyF:rgba(249,115,22,.05);
  --bsl:#ff2e63; --ssl:#08d9d6; --fvg:rgba(250,204,21,.18); --fvgB:rgba(250,204,21,.55);
  --shadow:0 6px 24px rgba(0,0,0,.45);
  --tfUp:#089981; --tfDown:#f23645;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  --ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,'Helvetica Neue',Arial,sans-serif;
}
body.light{
  --bg:#ffffff; --panel:#f0f3fa; --panel2:#e8ecf4; --border:#e0e3eb; --border2:#d1d4dc;
  --text:#131722; --text2:#787b86; --text3:#9598a1; --hover:#e8ecf4;
  --cross:#9598a1; --shadow:0 6px 24px rgba(0,0,0,.15);
  --asiaF:rgba(99,102,241,.10); --asiaB:rgba(99,102,241,.55);
  --lonF:rgba(59,130,246,.06); --nyF:rgba(249,115,22,.06);
  --fvg:rgba(250,204,21,.22); --fvgB:rgba(224,168,0,.7);
}
body.apptheme{
  --bg:#000000; --panel:#0F0F0F; --panel2:#1F1F1F; --border:#2E2E2E; --border2:#4A4A4A;
  --text:#DBDBDB; --text2:#B8B8B8; --text3:#8C8C8C; --hover:#1F1F1F;
  --up:#22AB94; --down:#F7525F; --accent:#2962FF; --cross:#8C8C8C;
  --upF:rgba(34,171,148,.10); --downF:rgba(247,82,95,.10);
  --shadow:0 8px 28px rgba(0,0,0,.7);
  --asiaF:rgba(99,102,241,.05); --asiaB:rgba(129,140,248,.5);
  --lonF:rgba(59,130,246,.045); --nyF:rgba(249,115,22,.045);
}
body.apptheme #dash{background:rgba(15,15,15,.9)}
body.apptheme .tooltip{background:rgba(15,15,15,.96)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:12px/1.35 var(--ui);overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;outline:none}
.spacer{flex:1}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- app grid ---------- */
#app{display:grid;grid-template-rows:38px 1fr 24px;height:100vh;width:100vw}

/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:8px;padding:0 10px 0 8px;
  background:var(--panel);border-bottom:1px solid var(--border);position:relative;z-index:40}
.brand{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;letter-spacing:.2px;
  padding-right:4px;white-space:nowrap}
.brand .logo{color:var(--accent);font-size:15px;line-height:1}
.symbtn{display:flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:4px;
  background:var(--panel2);border:1px solid var(--border);font-size:13px;font-weight:600;white-space:nowrap}
.symbtn:hover{background:var(--hover)}
.symbtn .feed{color:var(--text2);font-weight:400;font-size:11px}
.symbtn .caret{opacity:.7;margin-left:2px}
.divider{width:1px;height:20px;background:var(--border);flex:none}
.tfbar{display:flex;align-items:center;gap:1px}
.tfbar button{height:24px;min-width:29px;padding:0 6px;border-radius:3px;font-size:12px;color:var(--text2)}
.tfbar button:hover{background:var(--hover);color:var(--text)}
.tfbar button.on{background:var(--accent);color:#fff;font-weight:600}
.tbtn{display:flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:4px;
  color:var(--text);font-size:12px;white-space:nowrap}
.tbtn:hover{background:var(--hover)}
.tbtn .k{font-size:10px;color:var(--text2)}
.clock{font-family:var(--mono);font-size:11px;color:var(--text2);padding:0 4px;white-space:nowrap}
.iconbtn{width:26px;height:26px;border-radius:4px;display:grid;place-items:center;color:var(--text2);font-size:14px}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.iconbtn.on{color:var(--accent)}

/* ---------- main ---------- */
#main{display:grid;grid-template-columns:52px 1fr 220px;min-height:0;overflow:hidden}

/* left rail */
#rail{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;
  align-items:center;padding:6px 0;gap:2px;overflow-y:auto;overflow-x:hidden}
.rbtn{width:38px;height:34px;border-radius:4px;display:grid;place-items:center;color:var(--text2);position:relative}
.rbtn:hover{background:var(--hover);color:var(--text)}
.rbtn.on{background:var(--accent);color:#fff}
.rbtn svg{width:20px;height:20px;display:block}
.rbtn .tip{position:absolute;left:44px;top:50%;transform:translateY(-50%);background:var(--panel2);
  color:var(--text);border:1px solid var(--border);padding:3px 7px;border-radius:4px;font-size:11px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s;z-index:60;box-shadow:var(--shadow)}
.rbtn:hover .tip{opacity:1}
.railsep{width:26px;height:1px;background:var(--border);margin:5px 0;flex:none}

/* chart area */
#chartwrap{position:relative;min-width:0;overflow:hidden;background:var(--bg)}
#chart{position:absolute;inset:0;display:block;cursor:crosshair}

/* legend overlay */
#legend{position:absolute;left:10px;top:8px;pointer-events:none;font-size:12px;
  text-shadow:0 1px 2px rgba(0,0,0,.55);line-height:17px;max-width:62%}
body.light #legend{text-shadow:none}
#legend .l1{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:600}
#legend .l1 .feed{color:var(--text2);font-weight:400;font-size:11px}
#legend .l1 .tfb{color:var(--text2);font-weight:500}
#legend .l2{color:var(--text);font-size:12px;display:flex;gap:8px;flex-wrap:wrap}
#legend .l2 b{font-weight:500}
#legend .l3{color:var(--text2);font-size:11px;display:flex;gap:10px;flex-wrap:wrap;margin-top:1px}
#legend .l3 span b{color:var(--text)}
#legend .bull{color:var(--up)} #legend .bear{color:var(--down)}

/* dashboard */
#dash{position:absolute;right:74px;top:8px;width:186px;background:rgba(30,34,45,.86);
  border:1px solid var(--border);border-radius:4px;font-size:11px;padding:6px 8px;pointer-events:none;
  backdrop-filter:blur(3px);line-height:16px}
body.light #dash{background:rgba(240,243,250,.92)}
#dash .h{font-weight:600;font-size:11px;color:var(--text);letter-spacing:.2px;margin-bottom:3px;
  display:flex;justify-content:space-between}
#dash .row{display:flex;justify-content:space-between;color:var(--text2)}
#dash .row b{color:var(--text);font-weight:500}
#dash .ok{color:var(--up)} #dash .warn{color:#f7b924} #dash .bad{color:var(--down)}

/* right panel */
#right{background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;
  min-height:0;overflow:hidden}
.rp-head{display:flex;align-items:center;justify-content:space-between;padding:7px 10px 5px;
  font-size:11px;letter-spacing:.6px;color:var(--text2);text-transform:uppercase;font-weight:600}
.wl{display:flex;flex-direction:column}
.wlrow{display:grid;grid-template-columns:1fr auto;gap:2px 6px;padding:6px 10px;cursor:pointer;
  border-left:2px solid transparent}
.wlrow:hover{background:var(--hover)}
.wlrow.on{background:var(--panel2);border-left-color:var(--accent)}
.wlrow .nm{font-size:12px;font-weight:600;display:flex;gap:4px;align-items:baseline}
.wlrow .nm .s{font-size:11px;color:var(--text2);font-weight:400}
.wlrow .px{font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.wlrow .ch{font-size:11px;color:var(--text2);text-align:right}
.wlrow .u{color:var(--up)} .wlrow .d{color:var(--down)}
#objlist{display:flex;flex-direction:column;overflow-y:auto;min-height:0}
.obj{display:flex;align-items:center;gap:6px;padding:4px 10px;font-size:11px;color:var(--text2);cursor:pointer}
.obj:hover{background:var(--hover);color:var(--text)}
.obj.on{background:var(--panel2);color:var(--text)}
.obj .sw{width:8px;height:8px;border-radius:2px;flex:none}
.obj .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obj .eye,.obj .del{opacity:.5;font-size:11px;padding:0 2px}
.obj .eye:hover,.obj .del:hover{opacity:1;color:var(--text)}
.obj .off{opacity:.35}
.empty{color:var(--text3);font-size:11px;padding:8px 10px;line-height:16px}

/* status bar */
#statusbar{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);
  border-top:1px solid var(--border);font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden}
#statusbar .dot{opacity:.5}
#statusbar b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
#statusbar .mini{width:20px;height:18px;border-radius:3px;color:var(--text2);font-size:12px}
#statusbar .mini:hover{background:var(--hover);color:var(--text)}
#statusbar .mini.wide{width:auto;padding:0 6px;font-size:11px}
#statusbar .replay{opacity:.45;padding:0 6px;font-size:11px}

/* menus / cards */
.menu{position:absolute;background:var(--panel2);border:1px solid var(--border);border-radius:6px;
  box-shadow:var(--shadow);z-index:70;padding:5px;min-width:190px}
.menu .mi{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;cursor:pointer;
  font-size:12px;white-space:nowrap}
.menu .mi:hover{background:var(--hover)}
.menu .mi .sub{color:var(--text2);font-size:11px;margin-left:auto}
.menu .mi.on{color:var(--accent)}
.menu .mi svg{width:16px;height:16px;flex:none;opacity:.9}
.menu .mi.on svg{color:var(--accent);opacity:1}
.rbtn svg *{vector-effect:non-scaling-stroke}
.menu .mhead{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);padding:5px 8px 3px}
.card{position:absolute;background:var(--panel2);border:1px solid var(--border);border-radius:6px;
  box-shadow:var(--shadow);z-index:65;padding:10px 12px;width:266px}
.card h4{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--text2);
  margin:0 0 7px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card h4 .x{cursor:pointer;font-size:14px;color:var(--text2);line-height:1}
.card label.ck{display:flex;align-items:center;gap:7px;padding:3px 0;cursor:pointer;font-size:12px}
.card label.ck input{accent-color:var(--accent);width:13px;height:13px}
.card .grp{border-top:1px solid var(--border);margin:7px 0 0;padding-top:7px}
.card .frow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0;font-size:11px;color:var(--text2)}
.card .frow input[type=number]{width:64px;background:var(--bg);border:1px solid var(--border);
  color:var(--text);border-radius:3px;padding:2px 4px;font:inherit;font-size:11px}
.card .frow input[type=color]{width:24px;height:18px;background:none;border:1px solid var(--border);border-radius:3px;padding:0}
.tooltip{position:absolute;background:rgba(30,34,45,.94);border:1px solid var(--border2);border-radius:4px;
  padding:5px 8px;font-size:11px;line-height:16px;pointer-events:none;z-index:50;box-shadow:var(--shadow);
  font-variant-numeric:tabular-nums;white-space:nowrap}
body.light .tooltip{background:rgba(255,255,255,.97)}
.tooltip .u{color:var(--up)} .tooltip .d{color:var(--down)}
</style>
</head>
<body class="dark">
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="logo">&#9672;</span>XAUView</div>
    <button id="symBtn" class="symbtn">
      <span class="feed" id="feedLbl">OANDA:</span><span id="symLbl">XAUUSD</span>
      <svg class="caret" width="9" height="9" viewBox="0 0 10 10"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <div id="symMenu" class="menu hidden"></div>
    <div class="divider"></div>
    <div id="tfbar" class="tfbar"></div>
    <div class="divider"></div>
    <button class="tbtn" id="indBtn"><span>&#8767;</span>Indikatorlar<span class="k">f</span></button>
    <button class="tbtn" id="drawBtn"><span>&#9998;</span>Chizish</button>
    <div class="spacer"></div>
    <div class="clock" id="clock">--:--:--</div>
    <button class="iconbtn" id="shotBtn" title="PNG eksport">&#10515;</button>
    <button class="iconbtn" id="themeBtn" title="Tema (light/dark)">&#9789;</button>
    <button class="iconbtn" id="fsBtn" title="To'liq ekran">&#9974;</button>
  </header>
  <div id="main">
    <aside id="rail"></aside>
    <section id="chartwrap">
      <canvas id="chart"></canvas>
      <div id="legend"></div>
      <div id="dash"></div>
      <div id="indPanel" class="card hidden"></div>
      <div id="drawMenu" class="menu hidden"></div>
      <div id="measureTip" class="tooltip hidden"></div>
    </section>
    <aside id="right">
      <div class="rp-head"><span>Watchlist</span><span style="font-size:10px">snapshot</span></div>
      <div class="wl" id="wl"></div>
      <div class="rp-head" style="margin-top:2px"><span>Chizmalar</span><span id="objCount" style="font-size:10px"></span></div>
      <div id="objlist"></div>
    </aside>
  </div>
  <footer id="statusbar">
    <span id="sourceLbl"></span>
    <span class="dot">&#183;</span>
    <span id="ohlcLbl"></span>
    <div class="spacer"></div>
    <button class="mini" id="zoomOut" title="Zoom out">&#8722;</button>
    <button class="mini" id="zoomIn" title="Zoom in">+</button>
    <button class="mini wide" id="fitBtn">Fit</button>
    <span class="replay" title="Replay keyingi bosqichda (P5)">&#9654; Replay</span>
  </footer>
</div>
