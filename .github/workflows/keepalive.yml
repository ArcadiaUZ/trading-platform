name: Render keep-alive

# Render FREE instance 15 daqiqa harakatsizlikdan keyin uxlaydi.
# Bu workflow har 10 daqiqada /api/health ni uradi -> instance uyg'oq qoladi.
#
# URL: xauview.onrender.com standart qiymat sifatida yozilgan (setup kerak emas).
# Boshqa URL kerak bo'lsa: repo secret RENDER_URL ni o'zgartiring.
#
# Eslatma: GitHub schedule ba'zan 5-15 daqiqaga kechikadi; baribir 15 daqiqalik
# uyqu oynasidan oldin urinadi. Qo'shimcha kafolat uchun UptimeRobot (5 daqiqa)
# ishlatsa bo'ladi - docs/RENDER.md ga qarang.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Render /api/health ni urish
        env:
          RENDER_URL: ${{ secrets.RENDER_URL || 'https://xauview.onrender.com' }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_URL:-}" ]; then
            echo "::error::RENDER_URL secret yo'q. Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          url="${RENDER_URL%/}/api/health"
          echo "GET $url"
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 90 "$url" || true)
            echo "attempt=$attempt http=$code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json; echo
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Render javob bermadi (cold start yoki deploy davom etayotgan bo'lishi mumkin)"
          exit 1
